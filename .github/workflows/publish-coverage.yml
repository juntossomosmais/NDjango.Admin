name: Publish coverage report

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'test/**'
      - '*.sln'
      - '**/Directory.Build.props'
  workflow_dispatch:

jobs:
  publish-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Run JavaScript tests
        run: |
          npm ci
          npm test
      - uses: actions/setup-dotnet@v5
        with:
          # All three, not just the newest: the SDK that builds every target framework is 10, but
          # running the net8.0 and net9.0 test runs needs their runtimes on the agent as well.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Install all tools
        run: |
          dotnet tool restore
      - name: Build the project, run all tests and publish to SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT_VERSION: ${{ github.sha }}
          SOURCE_BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -e
          docker compose up --detach --wait --wait-timeout 120 db
          docker compose up --detach --wait --wait-timeout 120 --remove-orphans mongoClusterSetup
          ./scripts/start-sonarcloud.sh